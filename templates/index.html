<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEMA Booths Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: #f9fafb;
      padding: 20px;
    }
    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .left-panel {
      flex: 1;
      min-width: 320px;
    }
    .right-panel {
      flex: 1;
      min-width: 340px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .booth-card {
      border-radius: 10px;
      margin: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .booth-card:hover {
      transform: scale(1.05);
    }
    .accordion-button::after {
      transition: transform 0.2s;
    }
    .accordion-button.collapsed::after {
      transform: rotate(0deg);
    }
    .accordion-button:not(.collapsed)::after {
      transform: rotate(180deg);
    }
    textarea {
      resize: none;
    }
    @media(max-width: 768px) {
      .main-layout {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <h2 class="mb-4 text-center">🚗 SEMA Booths Directory</h2>

    <div class="main-layout">
      <!-- LEFT PANEL -->
      <div class="left-panel">
        <div class="mb-3">
          <label for="hallSelect" class="form-label fw-bold">Select Hall:</label>
          <select id="hallSelect" class="form-select">
            <option value="">-- Choose a Hall --</option>
            {% for hall in halls %}
              <option value="{{ hall }}">{{ hall }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Accordion for revenue sections -->
        <div class="accordion" id="revenueAccordion">
          <div class="accordion-item">
            <h2 class="accordion-header" id="heading1">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse1">
                💰 $1M to $3M
              </button>
            </h2>
            <div id="collapse1" class="accordion-collapse collapse" data-bs-parent="#revenueAccordion">
              <div class="accordion-body d-flex flex-wrap" id="rev1to3"></div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header" id="heading2">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse2">
                💰 $3M to $5M
              </button>
            </h2>
            <div id="collapse2" class="accordion-collapse collapse" data-bs-parent="#revenueAccordion">
              <div class="accordion-body d-flex flex-wrap" id="rev3to5"></div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header" id="heading3">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse3">
                💰 Above $5M / Not Specified
              </button>
            </h2>
            <div id="collapse3" class="accordion-collapse collapse show" data-bs-parent="#revenueAccordion">
              <div class="accordion-body d-flex flex-wrap" id="revAbove5"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel" id="boothDetails">
        👈 Select a hall and click a booth to view its details.
      </div>
    </div>
  </div>

  <script>
    const hallSelect = document.getElementById("hallSelect");
    const boothDetails = document.getElementById("boothDetails");

    hallSelect.addEventListener("change", async function() {
      const hall = this.value.trim();

      ["rev1to3", "rev3to5", "revAbove5"].forEach(id => {
        document.getElementById(id).innerHTML = "";
      });

      boothDetails.innerHTML = "Loading booths...";

      if (!hall) {
        boothDetails.innerHTML = "👈 Select a hall to view booths.";
        return;
      }

      const res = await fetch(`/booths?hall=${encodeURIComponent(hall)}`);
      const booths = await res.json();

      if (booths.length === 0) {
        boothDetails.innerHTML = "No booths found for this hall.";
        return;
      }

      boothDetails.innerHTML = "Select a booth to view details.";

      booths.forEach(b => {
        const tech = (b.technology || "").toLowerCase();
        const meetBooth = (b.meetbooth || "").trim().toLowerCase() === "yes";

        // Base background color by technology (unchanged)
        let bgColor = "#F7263B"; // default red
        if (tech.includes("magento")) bgColor = "#FFD580"; // light orange
        else if (tech.includes("woo")) bgColor = "#E6CCFF"; // light purple
        else if (tech.includes("shopify")) bgColor = "#C6F6C6"; // light green
        else if (tech.includes("nop")) bgColor = "#ADD8FF";  // light blue 
        else if (tech.includes("big")) bgColor = "#f8f9fa";  // light grey
        else if (tech.includes("web")) bgColor = "#9494FA";  // sky blue

        // Dual color if meetbooth = Yes
        const cardStyles = meetBooth
          ? `background: linear-gradient(135deg, ${bgColor} 50%, #FAF794 50%); border: 2px solid #000;`
          : `background-color: ${bgColor};`;

        const div = document.createElement("div");
        div.className = "card booth-card text-center p-2 shadow-sm";
        div.style = `${cardStyles} width: 140px; cursor: pointer;`;
        div.innerHTML = `
          <strong>${b.booth_number || ""}</strong><br>
          <small>${b.company_name || ""}</small>
        `;
        div.onclick = () => showBooth(b.booth_number);

        // Classify by revenue
        let revenueRaw = (b.revenue || "").replace(/[^0-9.]/g, "");
        let revenue = parseFloat(revenueRaw);

        if (!isNaN(revenue)) {
          if (revenue >= 1 && revenue < 3) {
            document.getElementById("rev1to3").appendChild(div);
          } else if (revenue >= 3 && revenue <= 5) {
            document.getElementById("rev3to5").appendChild(div);
          } else if (revenue > 5) {
            document.getElementById("revAbove5").appendChild(div);
          }
        } else {
          // No revenue / invalid / blank → goes to Above $5M
          document.getElementById("revAbove5").appendChild(div);
        }
      });
    });

    async function showBooth(boothNumber) {
      const res = await fetch(`/booth/${boothNumber}`);
      const data = await res.json();
      console.log(data)

      if (data.error) {
        boothDetails.innerHTML = data.error;
        return;
      }

      const firstNames = (data.first_name || "").split("; ");
      const lastNames = (data.last_name || "").split("; ");
      const roles = (data.job_title || "").split("; ");
      const phones = (data.direct_phone_number || "").split("; ");
      const mobiles = (data.mobile_phone || "").split("; ");
      const emails = (data.email_address || "").split("; ");

      let contactsHTML = "";
      for (let i = 0; i < firstNames.length; i++) {
        if (!firstNames[i] && !lastNames[i]) continue;
        contactsHTML += `
          <div class="mb-2">
            👤 <b>${firstNames[i] || ""} ${lastNames[i] || ""}</b> — ${roles[i] || ""}<br>
            📞 ${phones[i] || ""} | 📱 ${mobiles[i] || ""}<br>
            ✉️ ${emails[i] || ""}
          </div>
          <hr>
        `;
      }

      boothDetails.innerHTML = `
        <h4 class="text-primary">${data.company_name}</h4>
        <p><strong>Booth:</strong> ${data.booth_number}</p>
        <p><strong>Hall:</strong> ${data.hall}</p>
        <p><strong>Technology:</strong> ${data.technology}</p>
        <p><strong>Website:</strong> <a href="http://${data.website}" target="_blank">${data.website}</a></p>
        <p><strong>Revenue:</strong> ${data.revenue || ""}</p>

        <h5 class="mt-3">Contacts:</h5>
        ${contactsHTML}

        <p><strong>Contact Person From Our End :</strong> ${data.contactby || ""}</p>

        <h5 class="mt-3">📝 General Notes:</h5>
        <textarea class="form-control" id="noteBox" rows="3">${data.notes || ""}</textarea>

        <h5 class="mt-3">🚀 Pre-Show Notes:</h5>
        <textarea class="form-control" id="preShowBox" rows="3">${data.preshow_notes || ""}</textarea>

        <h5 class="mt-3">🎯 Post-Show Notes:</h5>
        <textarea class="form-control" id="postShowBox" rows="3">${data.postshow_notes || ""}</textarea>

        <button class="btn btn-sm btn-primary mt-3" onclick="saveNotes('${data.booth_number}')">💾 Save All</button>
        <div id="saveMsg" class="mt-2 text-success"></div>
      `;
    }

    async function saveNotes(boothNumber) {
      const note = document.getElementById("noteBox").value;
      const preshow = document.getElementById("preShowBox").value;
      const postshow = document.getElementById("postShowBox").value;

      const res = await fetch("/booth/" + boothNumber, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({note, preshow, postshow})
      });

      const data = await res.json();
      document.getElementById("saveMsg").textContent = data.message || data.error || "Saved!";
    }
  </script>
</body>
</html>
